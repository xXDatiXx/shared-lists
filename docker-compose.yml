version: '3.8'

services:
  app:
    build: .
    container_name: listas-compartidas
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "3001:3001"
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=production
    volumes:
      - app-data:/app/server/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  app-data:
    driver: local
